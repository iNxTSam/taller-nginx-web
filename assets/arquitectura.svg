<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#22d3ee"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#818cf8"/>
    </marker>
  </defs>

  <rect width="1100" height="520" rx="24" fill="url(#bg)"/>
  <circle cx="980" cy="80" r="120" fill="#6366f1" opacity="0.16" filter="url(#glow)"/>
  <circle cx="100" cy="470" r="110" fill="#22d3ee" opacity="0.1" filter="url(#glow)"/>

  <text x="50" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#eef2ff">Arquitectura del despliegue</text>
  <text x="50" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#93a1bd">Navegador externo → DuckDNS → Oracle Cloud → Nginx → sitio estático</text>

  <g>
    <rect x="50" y="200" width="170" height="120" rx="16" fill="#111d35" stroke="#2a3a5e" stroke-width="1.5"/>
    <rect x="94" y="222" width="82" height="54" rx="6" fill="#0b1224" stroke="#22d3ee" stroke-width="1.5"/>
    <path d="M94 282h82l-10-12H104z" fill="#17233d" stroke="#22d3ee" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="118" cy="310" r="3" fill="#34d399"/>
    <text x="128" y="314" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#c7d2fe">Navegador externo</text>
    <text x="135" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">http://</text>
  </g>

  <g>
    <rect x="310" y="180" width="190" height="160" rx="16" fill="#111d35" stroke="#2a3a5e" stroke-width="1.5"/>
    <path d="M371 244a18 18 0 0 1 3.3-35.6 23 23 0 0 1 42.4 6.1 16 16 0 0 1-4.7 31.4z" fill="none" stroke="#22d3ee" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="405" y="273" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#eef2ff" text-anchor="middle">DuckDNS</text>
    <text x="405" y="295" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#93a1bd" text-anchor="middle">subdominio.duckdns.org</text>
    <text x="405" y="313" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#22d3ee" text-anchor="middle">→ IP pública de la VM</text>
  </g>

  <g>
    <path d="M220 260h80" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
    <path d="M500 260h70" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
    <text x="247" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#93a1bd">HTTP :80</text>
    <text x="512" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#93a1bd">HTTP :80</text>
  </g>

  <rect x="580" y="140" width="470" height="300" rx="20" fill="#0d182c" stroke="#334155" stroke-width="1.5"/>
  <text x="606" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#818cf8">ORACLE CLOUD INFRASTRUCTURE</text>
  <text x="606" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">VCN red-infraestructura · subred-web 10.0.0.0/24</text>

  <rect x="606" y="212" width="418" height="200" rx="14" fill="#111d35" stroke="#2a3a5e" stroke-width="1.5"/>
  <text x="624" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#c7d2fe">Máquina virtual Oracle Linux 9.8 · servidor-web-2</text>
  <rect x="624" y="254" width="180" height="136" rx="12" fill="#0b1224" stroke="#22d3ee" stroke-width="1.3"/>
  <text x="714" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#eef2ff" text-anchor="middle">Nginx</text>
  <text x="714" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#93a1bd" text-anchor="middle">puerto 80</text>
  <rect x="642" y="318" width="144" height="8" rx="4" fill="#243555"/>
  <rect x="642" y="334" width="110" height="8" rx="4" fill="#243555"/>
  <rect x="642" y="350" width="126" height="8" rx="4" fill="#243555"/>
  <circle cx="650" cy="374" r="4" fill="#34d399"/>
  <text x="662" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#34d399">servicio activo</text>

  <rect x="824" y="254" width="180" height="136" rx="12" fill="#0b1224" stroke="#2a3a5e" stroke-width="1.3"/>
  <text x="914" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#eef2ff" text-anchor="middle">/var/www/mi-sitio</text>
  <text x="914" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#93a1bd" text-anchor="middle">archivos estáticos</text>
  <rect x="844" y="320" width="140" height="10" rx="4" fill="#1e2c4d"/>
  <rect x="844" y="338" width="96" height="8" rx="4" fill="#243555"/>
  <rect x="844" y="354" width="120" height="8" rx="4" fill="#243555"/>
  <text x="914" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#22d3ee" text-anchor="middle">index.html · css · js · img</text>

  <g>
    <rect x="580" y="460" width="220" height="40" rx="12" fill="#111d35" stroke="#2a3a5e"/>
    <text x="596" y="485" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#c7d2fe">Reglas: TCP 22 (SSH) y TCP 80 (HTTP)</text>
  </g>

  <g>
    <rect x="50" y="360" width="170" height="110" rx="16" fill="#111d35" stroke="#2a3a5e" stroke-width="1.5"/>
    <rect x="110" y="380" width="50" height="34" rx="4" fill="#0b1224" stroke="#818cf8" stroke-width="1.5"/>
    <path d="M112 414h46" stroke="#818cf8" stroke-width="1.5"/>
    <text x="135" y="445" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#c7d2fe" text-anchor="middle">Administración</text>
    <text x="135" y="461" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#93a1bd" text-anchor="middle">SSH :22</text>
  </g>

  <path d="M220 415h320c30 0 40-30 40-60v-60" stroke="#818cf8" stroke-width="2" stroke-dasharray="6 6" fill="none" marker-end="url(#arrow2)"/>
  <text x="325" y="402" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#93a1bd">ssh -i llave.key ubuntu@IP</text>
</svg>
